name: FreeMCHost Auto Renew

on:
  schedule:
    # 每 6 小时巡检一次（北京时间 18,00,06,12,18,00）
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write      # 允许写入 Secret (回写登录态)
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🧭 计算代理地址
        id: proxy
        env:
          P: ${{ secrets.PROXY_URL }}
        run: |
          if [ -n "$P" ]; then echo "url=$P" >> $GITHUB_OUTPUT;
          elif [ "${{ secrets.NODE_LINK }}" != "" ]; then echo "url=http://127.0.0.1:1080" >> $GITHUB_OUTPUT;
          else echo "url=" >> $GITHUB_OUTPUT; fi

      - name: ⚙️ 部署 sing-box 代理
        if: ${{ steps.proxy.outputs.url == 'http://127.0.0.1:1080' }}
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔐 验证登录凭证
        run: |
          if [ -z "${{ secrets.FREE_EMAIL }}" ] && [ -z "${{ secrets.AUTH_STATE }}" ]; then
            echo "❌ 未配置 FREE_EMAIL / FREE_PASSWORD，或 AUTH_STATE"
            exit 1
          fi

      - name: 🚀 运行续期脚本
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          AUTH_STATE: ${{ secrets.AUTH_STATE }}
          AUTH_STATE_FILE: ''   # 留空；脚本会自动读取仓库文件
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTO_UPDATE_STATE: ${{ vars.AUTO_UPDATE_STATE || 'true' }}
          RENEW_THRESHOLD_HOURS: ${{ vars.RENEW_THRESHOLD_HOURS || '46' }}
          RENEW_DURATION_LABEL: ${{ vars.RENEW_DURATION_LABEL || '60 hours' }}
          VERIFY_MIN_HOURS: ${{ vars.VERIFY_MIN_HOURS || '20' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          HEADLESS: true
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
          LOCALE: ${{ vars.LOCALE || 'en-US' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ steps.proxy.outputs.url }}
        run: npm start

      - name: ☁️ 上传截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Artifacts-${{ github.run_number }}
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧹 清理旧工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          retain_min_runs: 1
